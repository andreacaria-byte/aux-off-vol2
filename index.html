<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUX-OFF Vol. 2 — Team Peak vs Team Prime</title>
<link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Baloo+2:wght@500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root{
    --peak:#2f8fe0;
    --peak-dark:#1c5fb0;
    --prime:#ff3fa6;
    --prime-dark:#c21c78;
    --ufo-green:#9fe032;
    --atomic-purple:#7a4fe0;
    --bg:#cabdec;
    --card:#fdfbff;
    --ink:#2b2140;
    --muted:#8a7fa8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Baloo 2',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:24px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;position:relative;z-index:1;}

  .bg-decor{position:fixed;inset:0;overflow:hidden;pointer-events:none;}
  .bg-decor span{position:absolute;display:inline-block;line-height:1;
    animation-name:bgFloat;animation-timing-function:ease-in-out;animation-iteration-count:infinite;
    animation-duration:7s;transform:rotate(var(--r,0deg));}
  @keyframes bgFloat{
    0%,100%{transform:rotate(var(--r,0deg)) translateY(0);}
    50%{transform:rotate(var(--r,0deg)) translateY(-16px);}
  }
  header.top{text-align:center;margin-bottom:24px;position:relative;}
  header.top .kicker{
    text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--atomic-purple);font-weight:700;margin-bottom:8px;
  }
  .oval{display:inline-block;padding:10px 40px;border-radius:50% / 65%;background:linear-gradient(120deg,var(--peak),var(--prime));}
  header.top h1{
    font-family:'Racing Sans One',sans-serif;font-size:38px;margin:0;color:#fff;
    text-shadow:3px 3px 0 var(--ufo-green),6px 6px 0 var(--atomic-purple);
    letter-spacing:.02em;transform:skewX(-4deg);font-weight:400;
  }
  header.top .sub{color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.05em;margin-top:10px;}
  header.top .confetti{position:absolute;opacity:.8;font-size:15px;color:var(--ufo-green);}
  header.top .c1{top:-4px;left:8%;transform:rotate(-10deg);}
  header.top .c2{top:6px;right:10%;color:var(--prime);font-size:11px;transform:rotate(14deg);}

  .scoreboard{
    display:flex;align-items:center;justify-content:center;gap:18px;
    background:var(--card);border:2px solid var(--atomic-purple);
    border-radius:16px;padding:12px 18px;margin:0 auto 20px;max-width:480px;
  }
  .score-team{display:flex;flex-direction:column;align-items:center;min-width:90px;}
  .score-team .name{font-weight:700;font-size:12.5px;}
  .score-team .num{font-family:'Racing Sans One';font-size:30px;line-height:1;}
  .score-team.peak .num{color:var(--peak);}
  .score-team.prime .num{color:var(--prime);}
  .vs-mid{font-size:11px;color:var(--muted);font-weight:700;text-align:center;}

  .roster{display:flex;justify-content:space-between;gap:14px;max-width:480px;margin:0 auto 20px;}
  .roster-team{flex:1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .roster-person{display:flex;flex-direction:column;align-items:center;width:52px;}
  .roster-person img{
    width:46px;height:46px;border-radius:50%;object-fit:cover;
    border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.2);
  }
  .roster-team.peak .roster-person img{border-color:var(--peak);}
  .roster-team.prime .roster-person img{border-color:var(--prime);}
  .roster-person .rname{font-size:9.5px;font-weight:700;color:var(--ink);margin-top:3px;text-align:center;line-height:1.1;}

  .dots{display:flex;gap:6px;justify-content:center;margin-bottom:22px;flex-wrap:wrap;}
  .dot{
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;background:#fff;color:var(--muted);
    border:2px solid rgba(122,79,224,.3);
  }
  .dot.active{border-color:var(--ufo-green);box-shadow:0 0 0 3px rgba(159,224,50,.35);animation:pulse 1.6s infinite;}
  .dot.won-peak{background:var(--peak);color:#fff;border-color:var(--peak);}
  .dot.won-prime{background:var(--prime);color:#fff;border-color:var(--prime);}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(159,224,50,.35);}50%{box-shadow:0 0 0 7px rgba(159,224,50,.1);}}

  .card{
    background:var(--card);color:var(--ink);border-radius:20px;padding:26px 22px 22px;
    border:4px solid var(--atomic-purple);margin-bottom:20px;position:relative;
  }
  .cat-label{display:inline-block;background:var(--atomic-purple);color:#fff;font-weight:700;font-size:11.5px;
    padding:5px 14px;border-radius:999px;}
  .cat-label-row{text-align:center;margin-bottom:6px;}
  .cat-title{text-align:center;font-size:19px;font-weight:700;margin:10px 0 2px;}
  .cat-desc{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 8px;font-weight:600;}

  .sticker-wrap{position:absolute;top:-30px;right:22px;display:flex;align-items:flex-end;}
  .sticker-wrap img{height:54px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));}
  .sticker-wrap img.pair-a{transform:rotate(-10deg);height:50px;margin-right:-12px;}
  .sticker-wrap img.pair-b{transform:rotate(9deg);}
  .sticker-wrap img.solo{transform:rotate(8deg);}

  .matchup{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .team-card{
    flex:1;border-radius:14px;padding:18px 10px 16px;text-align:center;position:relative;
    border:2px dashed rgba(255,255,255,.55);
  }
  .team-card.peak{background:linear-gradient(135deg,#4fb3ff 0%,var(--atomic-purple) 100%);}
  .team-card.prime{background:linear-gradient(135deg,var(--atomic-purple) 0%,#ff5fb8 100%);}
  .team-card .team-tag{
    font-weight:700;font-size:11.5px;letter-spacing:.03em;color:#fff;
  }
  .ministar{position:absolute;top:8px;right:10px;color:#fff;opacity:.65;font-size:12px;}
  .song-title{font-family:'Luckiest Guy';font-size:19px;min-height:22px;word-break:break-word;color:#fff;
    text-shadow:2px 2px 0 rgba(0,0,0,.18);margin:6px 0 2px;display:block;letter-spacing:.01em;}
  .song-artist{font-size:11.5px;color:rgba(255,255,255,.9);margin-top:2px;min-height:16px;font-weight:600;}
  .placeholder{color:rgba(255,255,255,.7);font-style:italic;}

  .spotify-wrap{margin-top:10px;}
  .spotify-embed{border-radius:12px;display:block;}

  .vs-wrap{flex:0 0 auto;width:48px;height:48px;}
  .vs-badge{
    width:48px;height:48px;border-radius:50%;
    background:repeating-radial-gradient(circle,#fff 0 4px,#f0eaff 4px 8px);
    border:3px solid var(--ufo-green);color:var(--atomic-purple);font-family:'Racing Sans One';font-size:13px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.15);
  }

  .vote-btn{
    margin-top:14px;width:100%;padding:9px 8px;border-radius:999px;border:none;font-weight:700;
    font-size:13px;cursor:pointer;color:var(--ink);background:#fff;transition:transform .1s,opacity .1s;
    display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.12);
  }
  .vote-btn svg{width:13px;height:13px;flex:0 0 auto;}
  .vote-btn.peak{transform:rotate(-2deg);}
  .vote-btn.prime{transform:rotate(2deg);}
  .vote-btn:active{transform:scale(.97);}
  .vote-btn:disabled{opacity:.6;cursor:default;}

  .song-input{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.6);
    background:rgba(255,255,255,.92);color:var(--ink);font-size:13.5px;font-family:'Baloo 2';font-weight:600;
  }

  .bar-row{margin:18px 0 4px;}
  .bar-track{height:14px;border-radius:999px;background:#ece7fa;overflow:hidden;display:flex;}
  .bar-peak{background:var(--peak);height:100%;}
  .bar-prime{background:var(--prime);height:100%;}
  .bar-pcts{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:4px;}

  .status-line{text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px;font-weight:700;}
  .status-line.open{color:#3b8f2f;}
  .status-line.closed{color:var(--atomic-purple);}

  .winner-banner{
    text-align:center;margin-top:14px;padding:10px;border-radius:12px;font-weight:700;font-size:13.5px;
  }
  .winner-banner.peak{background:#e3f0fd;color:var(--peak-dark);}
  .winner-banner.prime{background:#ffe3f1;color:var(--prime-dark);}

  .panel{
    background:var(--card);border:2px solid rgba(122,79,224,.35);border-radius:16px;
    padding:16px 18px;margin-top:6px;
  }
  .panel h3{margin:0 0 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--atomic-purple);}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .row label{flex:1;min-width:220px;font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:700;}
  .row input{
    width:100%;padding:9px 10px;border-radius:8px;border:1px solid rgba(122,79,224,.3);
    background:#fff;color:var(--ink);font-size:14px;font-family:'Baloo 2';
  }
  .btn{
    padding:10px 18px;border-radius:999px;border:none;font-weight:700;font-size:13px;cursor:pointer;
    color:#fff;background:var(--atomic-purple);font-family:'Baloo 2';
  }
  .btn.secondary{background:#fff;border:2px solid var(--atomic-purple);color:var(--atomic-purple);}
  .btn.danger{background:var(--prime-dark);}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}

  .link-box{
    display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;
  }
  .link-box input{flex:1;min-width:200px;padding:9px 10px;border-radius:8px;border:1px solid rgba(122,79,224,.3);background:#fff;color:var(--ink);font-size:12.5px;font-family:'Baloo 2';}

  .banner{
    text-align:center;background:#fff4d6;color:#8a5a00;padding:8px 12px;border-radius:10px;
    font-size:12.5px;font-weight:700;margin-bottom:16px;border:1px solid #f3d38a;
  }

  .landing{max-width:520px;margin:40px auto 0;text-align:center;}
  .landing .card{padding:34px 26px;}
  .landing h2{margin-top:0;font-size:20px;}
  .landing p{color:var(--muted);font-size:13.5px;line-height:1.5;font-weight:600;}
  .landing .btn{width:100%;padding:14px;font-size:15px;margin-top:8px;}
  .landing .divider{color:var(--muted);font-size:11.5px;margin:16px 0;text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
  .landing .join-row{display:flex;gap:8px;}
  .landing .join-row input{flex:1;padding:11px;border-radius:10px;border:1px solid rgba(122,79,224,.3);font-size:14px;font-family:'Baloo 2';}

  .celebrate{text-align:center;padding:50px 20px;}
  .celebrate .trophy{font-size:60px;}
  .celebrate h2{font-family:'Racing Sans One';font-size:26px;margin:12px 0 6px;color:var(--atomic-purple);font-weight:400;}
  .confetti{position:fixed;top:-20px;font-size:20px;animation:fall linear infinite;pointer-events:none;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2;}}

  footer.note{text-align:center;color:var(--muted);font-size:11px;margin-top:28px;font-weight:600;}
  footer.note a{color:var(--atomic-purple);font-weight:700;}
  a{color:var(--atomic-purple);}
</style>
</head>

  <span style="top:88.1%;left:14.1%;font-size:24px;color:#fff;opacity:0.35;--r:1deg;animation-delay:1.7s;animation-duration:7.1s;">♡</span>
  <span style="top:85.3%;left:26.3%;font-size:26px;color:var(--peak);opacity:0.19;--r:-4deg;animation-delay:2.1s;animation-duration:7.7s;">●</span>
  <span style="top:90.9%;left:46.7%;font-size:30px;color:var(--prime);opacity:0.38;--r:12deg;animation-delay:1.8s;animation-duration:5.8s;">★</span>
  <span style="top:90.4%;left:54.6%;font-size:22px;color:var(--peak);opacity:0.25;--r:4deg;animation-delay:1.0s;animation-duration:6.3s;">●</span>
  <span style="top:86.9%;left:74.1%;font-size:28px;color:var(--prime);opacity:0.34;--r:-22deg;animation-delay:3.2s;animation-duration:6.2s;">♫</span>
  <span style="top:83.8%;left:96.2%;font-size:20px;color:var(--ufo-green);opacity:0.36;--r:14deg;animation-delay:0.5s;animation-duration:6.9s;">✧</span>
  <span style="top:99.0%;left:12.3%;font-size:24px;color:var(--ufo-green);opacity:0.31;--r:22deg;animation-delay:2.3s;animation-duration:8.4s;">✧</span>
  <span style="top:99.0%;left:60.8%;font-size:26px;color:var(--ufo-green);opacity:0.2;--r:19deg;animation-delay:2.7s;animation-duration:5.8s;">♥</span>
  <span style="top:99.0%;left:72.2%;font-size:16px;color:var(--atomic-purple);opacity:0.35;--r:-3deg;animation-delay:1.7s;animation-duration:6.6s;">☆</span>
  <span style="top:98.7%;left:88.5%;font-size:28px;color:var(--prime);opacity:0.28;--r:-2deg;animation-delay:2.0s;animation-duration:7.6s;">▲</span>
  <span style="top:99.0%;left:97.0%;font-size:22px;color:var(--atomic-purple);opacity:0.36;--r:9deg;animation-delay:2.5s;animation-duration:6.8s;">▲</span>
</div>
<div id="app" class="wrap"></div>

<script>
/* ============ ROUND DATA ============ */
const ROUND_DEFS = [
  {category:"The “It's 5 O'Clock Somewhere” Special", desc:"The exact song that flips your brain to weekend mode no matter the time or place.",
   stickers:["https://cdn-icons-png.flaticon.com/256/12640/12640031.png","https://cdn-icons-png.flaticon.com/256/6347/6347431.png"]},
  {category:"Guilty Pleasure", desc:"Zero-shame in this game, this song might not be everyone's cup of tea but the group will always belt it out.",
   stickers:["https://cdn-icons-png.flaticon.com/128/5835/5835834.png","https://cdn-icons-png.flaticon.com/256/7387/7387451.png"]},
  {category:"The Cha Cha Slide Up onto the Dancefloor", desc:"A song that makes it physically impossible to stay seated.",
   stickers:["https://cdn-icons-png.flaticon.com/256/7295/7295534.png"]},
  {category:"The “Hooked on a Feeling”", desc:"A track that instantly hooks you within the first few seconds.",
   stickers:["https://cdn-icons-png.flaticon.com/256/6534/6534341.png"]},
  {category:"Blast from the Past", desc:"Takes you straight back to a core memory the second the first note hits.",
   stickers:["https://cdn-icons-png.flaticon.com/256/14116/14116585.png","https://cdn-icons-png.flaticon.com/256/6397/6397089.png"]},
  {category:"The One-Hit Wonder", desc:"An iconic track from an artist who came, conquered, and vanished.",
   stickers:["https://cdn-icons-png.flaticon.com/256/10872/10872582.png"]},
  {category:"Peanut Butter & Jelly: A Perfect Pairing", desc:"Two artists coming together to make absolute magic.",
   stickers:["https://cdn-icons-png.flaticon.com/128/7463/7463153.png"]},
  {category:"It Puts the “Kara” in Karaoke", desc:"The song that gets the entire room holding imaginary microphones.",
   stickers:["https://cdn-icons-png.flaticon.com/256/9306/9306390.png"]},
  {category:"Smells Like Summer", desc:"Pure sunshine, bottled up and ready to play.",
   stickers:["https://cdn-icons-png.flaticon.com/256/7734/7734862.png"]},
  {category:"Country Roads... Take Me on a Trip", desc:"Windows down, highway driving, full car chorus.",
   stickers:["https://cdn-icons-png.flaticon.com/256/7496/7496829.png"]}
];

/* ============ TEAM ROSTER ============ */
const ROSTER = {
  peak: [
    {name:"Matt", img:"avatars/matt.jpg"},
    {name:"Lauren", img:"avatars/lauren.jpg"},
    {name:"Steph", img:"avatars/steph.jpg"},
    {name:"Jules", img:"avatars/jules.jpg"},
    {name:"Allan", img:"avatars/allan.jpg"}
  ],
  prime: [
    {name:"Queency", img:"avatars/queency.jpg"},
    {name:"Monique", img:"avatars/monique.jpg"},
    {name:"Nicole", img:"avatars/nicole.jpg"},
    {name:"Andrea", img:"avatars/andrea.jpg"}
  ]
};

function rosterHtml(){
  if(ROSTER.peak.length === 0 && ROSTER.prime.length === 0) return '';
  const person = p => `<div class="roster-person"><img src="${p.img}" alt="${esc(p.name)}"><div class="rname">${esc(p.name)}</div></div>`;
  return `
    <div class="roster">
      <div class="roster-team peak">${ROSTER.peak.map(person).join('')}</div>
      <div class="roster-team prime">${ROSTER.prime.map(person).join('')}</div>
    </div>`;
}

function defaultState(){
  return {
    currentRound: 0,
    finished: false,
    score: {peak:0, prime:0},
    rounds: ROUND_DEFS.map(r => ({
      category: r.category,
      desc: r.desc,
      stickers: r.stickers,
      peakSong: "", peakArtist: "", peakSpotify: "",
      primeSong: "", primeArtist: "", primeSpotify: "",
      peakVotes: 0, primeVotes: 0,
      status: "pending" // pending -> open -> closed
    }))
  };
}

/* ============ URL / SYNC HELPERS ============ */
const params = new URLSearchParams(location.search);
let BUCKET = params.get('bucket') || null;
let IS_HOST = params.get('host') === '1';
let syncOk = true;
let pollTimer = null;
let state = defaultState();
let lastSeen = "";

const FIREBASE_BASE = 'https://aux-off-vol2-default-rtdb.firebaseio.com';
function stateUrl(){ return `${FIREBASE_BASE}/sessions/${BUCKET}.json`; }

async function createBucket(){
  // Firebase doesn't need a create step - just mint a random session id.
  // Existence is established the first time we PUT state to it.
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}
async function pushState(){
  if(!BUCKET) return;
  try{
    const res = await fetch(stateUrl(), {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(state)
    });
    syncOk = res.ok;
  }catch(e){ syncOk = false; }
}
async function pullState(){
  if(!BUCKET) return;
  try{
    const res = await fetch(stateUrl(), {cache:'no-store'});
    if(res.ok){
      const data = await res.json();
      const txt = JSON.stringify(data);
      if(data && txt !== lastSeen){
        lastSeen = txt;
        state = data;
      }
      syncOk = true;
    }
  }catch(e){ syncOk = false; }
  // Don't wipe out a song/artist field mid-keystroke: a background poll would
  // otherwise re-render the whole page every ~2s and kick you out of the input.
  const active = document.activeElement;
  if(active && active.classList && active.classList.contains('song-input')) return;
  render();
}
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pullState, 2200);
}

function voterLink(){
  const u = new URL(location.href);
  u.search = '';
  u.searchParams.set('bucket', BUCKET);
  return u.toString();
}
function hostLink(){
  const u = new URL(location.href);
  u.search = '';
  u.searchParams.set('bucket', BUCKET);
  u.searchParams.set('host','1');
  return u.toString();
}

function votedKey(i){ return `auxoff2_voted_${BUCKET}_${i}`; }
function hasVoted(i){ return !!localStorage.getItem(votedKey(i)); }
function setVoted(i, team){ localStorage.setItem(votedKey(i), team); }

/* ============ ACTIONS ============ */
async function castVote(i, team){
  if(hasVoted(i)) return;
  setVoted(i, team);
  await pullState(); // get freshest counts first to reduce collisions
  if(team === 'peak') state.rounds[i].peakVotes++; else state.rounds[i].primeVotes++;
  render();
  await pushState();
}

async function updateSong(i, field, value){
  state.rounds[i][field] = value;
  await pushState();
}

async function openVoting(i){
  state.rounds[i].status = 'open';
  render();
  await pushState();
}

async function lockRound(i){
  await pullState();
  const r = state.rounds[i];
  r.status = 'closed';
  if(r.peakVotes > r.primeVotes){ r.winner='peak'; state.score.peak++; }
  else if(r.primeVotes > r.peakVotes){ r.winner='prime'; state.score.prime++; }
  else { r.winner='tie'; }
  render();
  await pushState();
}

async function nextRound(){
  if(state.currentRound < state.rounds.length - 1){
    state.currentRound++;
  } else {
    state.finished = true;
  }
  render();
  await pushState();
}

async function resetEvent(){
  if(!confirm('Reset all rounds and votes for everyone?')) return;
  state = defaultState();
  render();
  await pushState();
}

/* ============ RENDER ============ */
const app = document.getElementById('app');

function esc(s){
  const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
}

const starIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.6 6.6L21 9l-5 4.6L17.4 21 12 17l-5.4 4L8 13.6 3 9l6.4-.4z"/></svg>`;

function renderLanding(){
  app.innerHTML = `
    <header class="top">
      <span class="confetti c1">&#9733;</span><span class="confetti c2">&#9733;</span>
      <div class="kicker">Vendor Solutions Engagement · Showdown Series Vol. 2</div>
      <div class="oval"><h1>AUX-OFF</h1></div>
      <div class="sub">TEAM PEAK VS. TEAM PRIME — 10 ROUNDS, LIVE VOTING</div>
    </header>
    <div class="landing">
      <div class="card">
        <h2>Start or join the showdown</h2>
        <p>The host starts the event once, then shares one link with everyone so votes sync live across every phone.</p>
        <button class="btn" id="startHostBtn">🚀 Start as Host</button>
        <div class="divider">— or —</div>
        <p style="margin-bottom:6px;">Have a link from your host? Paste it here:</p>
        <div class="join-row">
          <input id="joinInput" placeholder="Paste the shared aux-off link">
          <button class="btn secondary" id="joinBtn">Join</button>
        </div>
      </div>
    </div>
    <footer class="note">Built for the Vendor Solutions Engagement team · votes sync via Firebase, so give it a quick test before the event. Stickers via <a href="https://www.flaticon.com" target="_blank" rel="noopener">Flaticon</a>.</footer>
  `;
  document.getElementById('startHostBtn').onclick = async () => {
    try{
      BUCKET = await createBucket();
      IS_HOST = true;
      const u = new URL(location.href);
      u.searchParams.set('bucket', BUCKET);
      u.searchParams.set('host','1');
      history.replaceState({}, '', u.toString());
      state = defaultState();
      await pushState();
      lastSeen = JSON.stringify(state);
      startPolling();
      render();
    }catch(e){
      alert('Could not reach the live-sync service right now (' + e.message + '). Check your connection and try again.');
    }
  };
  document.getElementById('joinBtn').onclick = () => {
    const val = document.getElementById('joinInput').value.trim();
    if(!val) return;
    try{
      const u = new URL(val);
      const b = u.searchParams.get('bucket');
      if(!b) throw new Error();
      location.href = `${location.pathname}?bucket=${b}`;
    }catch(e){ alert('That link doesn\'t look right — ask your host to resend it.'); }
  };
}

function scoreboardHtml(){
  return `
    <div class="scoreboard">
      <div class="score-team peak"><div class="name">TEAM PEAK</div><div class="num">${state.score.peak}</div></div>
      <div class="vs-mid">ROUNDS<br>WON</div>
      <div class="score-team prime"><div class="name">TEAM PRIME</div><div class="num">${state.score.prime}</div></div>
    </div>`;
}

function dotsHtml(){
  return `<div class="dots">${state.rounds.map((r,i)=>{
    let cls = 'dot';
    if(r.status==='closed'){
      if(r.winner==='peak') cls+=' won-peak';
      else if(r.winner==='prime') cls+=' won-prime';
    } else if(i===state.currentRound) cls+=' active';
    return `<div class="${cls}" title="Round ${i+1}: ${esc(r.category)}">${i+1}</div>`;
  }).join('')}</div>`;
}

function barsHtml(r){
  const total = r.peakVotes + r.primeVotes;
  const peakPct = total ? Math.round((r.peakVotes/total)*100) : 50;
  const primePct = 100 - peakPct;
  return `
    <div class="bar-row">
      <div class="bar-track">
        <div class="bar-peak" style="width:${total?peakPct:50}%"></div>
        <div class="bar-prime" style="width:${total?primePct:50}%"></div>
      </div>
      <div class="bar-pcts"><span>${r.peakVotes} votes (${total?peakPct:0}%)</span><span>${r.primeVotes} votes (${total?primePct:0}%)</span></div>
    </div>`;
}

function stickerHtml(r){
  const s = r.stickers || [];
  if(s.length === 0) return '';
  if(s.length === 1) return `<div class="sticker-wrap"><img class="solo" src="${s[0]}" alt=""></div>`;
  return `<div class="sticker-wrap"><img class="pair-a" src="${s[0]}" alt=""><img class="pair-b" src="${s[1]}" alt=""></div>`;
}

function syncBanner(){
  return syncOk ? '' : `<div class="banner">⚠️ Live sync is having trouble reaching the relay. Votes on this device may not be visible to others until it reconnects.</div>`;
}

function spotifyEmbedHtml(link){
  if(!link) return '';
  const m = String(link).match(/track\/([a-zA-Z0-9]+)/);
  if(!m) return '';
  const src = `https://open.spotify.com/embed/track/${m[1]}?utm_source=generator&theme=0`;
  return `<div class="spotify-wrap"><iframe class="spotify-embed" src="${src}" width="100%" height="80" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>`;
}

function renderMatchupCard(i, editable){
  const r = state.rounds[i];
  const voted = hasVoted(i);
  const votedTeam = localStorage.getItem(votedKey(i));

  const peakSongHtml = editable
    ? `<input placeholder="Song title" value="${esc(r.peakSong)}" data-field="peakSong" data-round="${i}" class="song-input">`
    : `<div class="song-title">${r.peakSong ? esc(r.peakSong) : '<span class="placeholder">Song TBD</span>'}</div><div class="song-artist">${esc(r.peakArtist)}</div>`;
  const primeSongHtml = editable
    ? `<input placeholder="Song title" value="${esc(r.primeSong)}" data-field="primeSong" data-round="${i}" class="song-input">`
    : `<div class="song-title">${r.primeSong ? esc(r.primeSong) : '<span class="placeholder">Song TBD</span>'}</div><div class="song-artist">${esc(r.primeArtist)}</div>`;

  let statusLine = '';
  if(r.status==='pending') statusLine = `<div class="status-line">Voting hasn't opened yet</div>`;
  if(r.status==='open') statusLine = `<div class="status-line open">🟢 Voting is live — cast your vote!</div>`;
  if(r.status==='closed'){
    if(r.winner==='tie') statusLine = `<div class="winner-banner">🤝 It's a tie!</div>`;
    else statusLine = `<div class="winner-banner ${r.winner}">🏆 Team ${r.winner==='peak'?'Peak':'Prime'} wins this round!</div>`;
  }

  const showBars = r.status==='open' || r.status==='closed';
  const canVote = r.status==='open' && !voted;

  return `
    <div class="card">
      ${stickerHtml(r)}
      <div class="cat-label-row"><span class="cat-label">Round ${i+1} of ${state.rounds.length}</span></div>
      <div class="cat-title">${esc(r.category)}</div>
      <div class="cat-desc">${esc(r.desc)}</div>
      <div class="matchup">
        <div class="team-card peak">
          <span class="ministar">&#9733;</span>
          <span class="team-tag">TEAM PEAK</span>
          ${peakSongHtml}
          ${editable ? `<input placeholder="Artist" value="${esc(r.peakArtist)}" data-field="peakArtist" data-round="${i}" class="song-input" style="margin-top:6px;">` : ''}
          ${editable ? `<input placeholder="Spotify song link (optional)" value="${esc(r.peakSpotify)}" data-field="peakSpotify" data-round="${i}" class="song-input" style="margin-top:6px;">` : ''}
          ${!editable ? spotifyEmbedHtml(r.peakSpotify) : ''}
          ${!editable ? `<button class="vote-btn peak" data-round="${i}" data-team="peak" ${canVote?'':'disabled'}>${votedTeam==='peak' ? '✅ Your Vote' : (r.status==='open' ? starIconSvg + 'Vote Peak' : '—')}</button>` : ''}
        </div>
        <div class="vs-wrap"><div class="vs-badge">VS</div></div>
        <div class="team-card prime">
          <span class="ministar">&#9733;</span>
          <span class="team-tag">TEAM PRIME</span>
          ${primeSongHtml}
          ${editable ? `<input placeholder="Artist" value="${esc(r.primeArtist)}" data-field="primeArtist" data-round="${i}" class="song-input" style="margin-top:6px;">` : ''}
          ${editable ? `<input placeholder="Spotify song link (optional)" value="${esc(r.primeSpotify)}" data-field="primeSpotify" data-round="${i}" class="song-input" style="margin-top:6px;">` : ''}
          ${!editable ? spotifyEmbedHtml(r.primeSpotify) : ''}
          ${!editable ? `<button class="vote-btn prime" data-round="${i}" data-team="prime" ${canVote?'':'disabled'}>${votedTeam==='prime' ? '✅ Your Vote' : (r.status==='open' ? starIconSvg + 'Vote Prime' : '—')}</button>` : ''}
        </div>
      </div>
      ${showBars ? barsHtml(r) : ''}
      ${statusLine}
    </div>
  `;
}

function renderVoter(){
  const i = state.currentRound;
  app.innerHTML = `
    <header class="top">
      <span class="confetti c1">&#9733;</span><span class="confetti c2">&#9733;</span>
      <div class="kicker">Vendor Solutions Engagement · Showdown Series Vol. 2</div>
      <div class="oval"><h1>AUX-OFF</h1></div>
      <div class="sub">TEAM PEAK VS. TEAM PRIME — LIVE VOTING</div>
    </header>
    ${syncBanner()}
    ${scoreboardHtml()}
    ${rosterHtml()}
    ${dotsHtml()}
    ${renderMatchupCard(i, false)}
    <footer class="note">Vote once per round from this device · results update automatically every couple of seconds.</footer>
  `;
  app.querySelectorAll('.vote-btn').forEach(btn=>{
    btn.onclick = () => castVote(parseInt(btn.dataset.round), btn.dataset.team);
  });
}

function renderHost(){
  const i = state.currentRound;
  const r = state.rounds[i];
  const link = voterLink();

  app.innerHTML = `
    <header class="top">
      <span class="confetti c1">&#9733;</span><span class="confetti c2">&#9733;</span>
      <div class="kicker">Vendor Solutions Engagement · Showdown Series Vol. 2 · HOST VIEW</div>
      <div class="oval"><h1>AUX-OFF</h1></div>
      <div class="sub">TEAM PEAK VS. TEAM PRIME — LIVE VOTING</div>
    </header>
    ${syncBanner()}
    ${scoreboardHtml()}
    ${rosterHtml()}
    ${dotsHtml()}

    <div class="panel" style="margin-bottom:20px;">
      <h3>📎 Share with your team (voter link)</h3>
      <div class="link-box">
        <input readonly value="${link}" id="voterLinkInput">
        <button class="btn secondary" id="copyLinkBtn">Copy</button>
      </div>
    </div>

    ${renderMatchupCard(i, r.status==='pending')}

    <div class="panel">
      <h3>Host controls — Round ${i+1}</h3>
      <div class="btn-row">
        ${r.status==='pending' ? `<button class="btn" id="openBtn">🎬 Open Voting</button>` : ''}
        ${r.status==='open' ? `<button class="btn" id="lockBtn">🔒 Lock &amp; Reveal Winner</button>` : ''}
        ${r.status==='closed' ? `<button class="btn" id="nextBtn">${i < state.rounds.length-1 ? 'Next Round →' : 'Finish Event 🏁'}</button>` : ''}
        <button class="btn danger" id="resetBtn">Reset Event</button>
      </div>
    </div>
    <footer class="note">Keep this host tab open on your device · the voter link works from any phone/laptop on any network.</footer>
  `;

  document.getElementById('copyLinkBtn').onclick = () => {
    navigator.clipboard.writeText(link).then(()=>{
      const b = document.getElementById('copyLinkBtn'); b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy',1500);
    });
  };
  app.querySelectorAll('.song-input').forEach(inp=>{
    inp.onchange = () => updateSong(parseInt(inp.dataset.round), inp.dataset.field, inp.value);
  });
  const openBtn = document.getElementById('openBtn'); if(openBtn) openBtn.onclick = () => openVoting(i);
  const lockBtn = document.getElementById('lockBtn'); if(lockBtn) lockBtn.onclick = () => lockRound(i);
  const nextBtn = document.getElementById('nextBtn'); if(nextBtn) nextBtn.onclick = () => nextRound();
  document.getElementById('resetBtn').onclick = resetEvent;
}

function renderFinished(){
  const winner = state.score.peak === state.score.prime ? 'tie' : (state.score.peak > state.score.prime ? 'peak' : 'prime');
  const confettiEmojis = ['★','✦','🎶','🏆','✨'];
  let confetti = '';
  for(let k=0;k<24;k++){
    confetti += `<div class="confetti" style="left:${Math.random()*100}vw;animation-duration:${3+Math.random()*3}s;animation-delay:${Math.random()*2}s;color:${k%2?'var(--prime)':'var(--peak)'}">${confettiEmojis[k%confettiEmojis.length]}</div>`;
  }
  app.innerHTML = `
    ${confetti}
    <div class="celebrate">
      <div class="trophy">🏆</div>
      <h2>${winner==='tie' ? "It's a tie!" : `Team ${winner==='peak'?'Peak':'Prime'} takes the crown!`}</h2>
      <div class="sub" style="color:var(--muted);font-weight:700;">Final score — Team Peak ${state.score.peak} : ${state.score.prime} Team Prime</div>
      <div style="margin-top:24px;">${dotsHtml()}</div>
      ${IS_HOST ? `<div class="btn-row" style="justify-content:center;margin-top:20px;"><button class="btn danger" id="resetBtn2">Reset for a rematch</button></div>` : ''}
    </div>
  `;
  const rb = document.getElementById('resetBtn2'); if(rb) rb.onclick = resetEvent;
}

function render(){
  if(!BUCKET){ renderLanding(); return; }
  if(state.finished){ renderFinished(); return; }
  if(IS_HOST) renderHost(); else renderVoter();
}

/* ============ INIT ============ */
(async function init(){
  if(BUCKET){
    await pullState();
    lastSeen = JSON.stringify(state);
    startPolling();
  }
  render();
})();
</script>
</body>
</html>
